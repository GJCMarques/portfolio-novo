<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MERCADO & CO. | Guilherme .M — Heritage</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/preloader.css">
  <link rel="stylesheet" href="assets/css/menu.css">
  <link rel="stylesheet" href="assets/css/hero.css">
  <link rel="stylesheet" href="assets/css/audio.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
</head>

<body>
  <div class="preloader" id="preloader">

    <!-- Background photos grid -->
    <div class="preloader__imgs" id="plImgs">
      <div class="preloader__img preloader__img--1">
        <img src="assets/img/loader/a.jpg" alt="">
      </div>
      <div class="preloader__img preloader__img--2">
        <img src="assets/img/loader/b.jpg" alt="">
      </div>
      <div class="preloader__img preloader__img--3">
        <img src="assets/img/loader/c.jpg" alt="">
      </div>
      <div class="preloader__img preloader__img--4">
        <img src="assets/img/loader/d.jpg" alt="">
      </div>
    </div>

    <!-- Overlay -->
    <div class="preloader__overlay"></div>

    <!-- Center Stage: SVG Logo + Name -->
    <div class="preloader__stage">

      <!-- SVG Logo — draw + fill animation -->
      <div class="preloader__logo-wrap">
        <svg class="preloader__logo-svg" id="plLogoSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480">
          <!-- Stroke draw layer -->
          <path class="pl-logo-stroke" id="plLogoStroke"
            d="M240.2 240A240 240 0 0 0 480 0H240a240 240 0 1 0 0 480h240a240 240 0 0 0-239.8-240Z" fill="none"
            stroke="#7D2E3D" stroke-width="4" />
          <!-- Fill layer -->
          <path class="pl-logo-fill" id="plLogoFill"
            d="M240.2 240A240 240 0 0 0 480 0H240a240 240 0 1 0 0 480h240a240 240 0 0 0-239.8-240Z" fill="#7D2E3D" />
        </svg>
      </div>

      <!-- Text block -->
      <div class="preloader__textblock">
        <div class="preloader__name-clip">
          <span class="preloader__name">Guilherme Marques</span>
        </div>
        <div class="preloader__meta-clip">
          <span class="preloader__meta">Portfolio &mdash; 2026</span>
        </div>
      </div>

    </div>



  </div>
  <div class="noise-overlay"></div>
  <nav class="nav-bar">
    <a href="index.html" class="brand-link">
      <img src="assets/img/logo.svg" alt="Logo" class="logo-img">
      <span class="signature-name">
        <span data-hover="Guilherme .M">Guilherme .M</span>
      </span>
    </a>
    <div class="menu-trigger" id="menuTrigger">
      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="menu-text">
        <div class="text-wrapper" id="menuTextInner">
          <span class="text-item" data-hover="MENU">MENU</span>
          <span class="text-item" data-hover="FECHAR">FECHAR</span>
        </div>
      </div>
    </div>
  </nav>

  <div class="menu-overlay" id="menuOverlay">
    <div class="menu-panel"></div>

    <div class="menu-container">

      <!-- NAVEGAÇÃO: Centro do ecrã -->
      <nav class="menu-nav">
        <div class="nav-links-wrapper">
          <div class="nav-item">
            <a href="index.html" class="nav-link is-active">
              <span data-hover="Home">Home</span>
            </a>
          </div>
          <div class="nav-item">
            <a href="#about" class="nav-link">
              <span data-hover="Sobre">Sobre</span>
            </a>
          </div>
          <div class="nav-item">
            <a href="#portfolio" class="nav-link">
              <span data-hover="Portfolio">Portfolio</span>
            </a>
          </div>
          <div class="nav-item">
            <a href="#services" class="nav-link">
              <span data-hover="Serviços">Serviços</span>
            </a>
          </div>
          <div class="nav-item">
            <a href="#contact" class="nav-link">
              <span data-hover="Contactos">Contactos</span>
            </a>
          </div>
        </div>
      </nav>

      <!-- FOOTER: Relógio (esq) + Lang (centro) + Sociais (dir) -->
      <footer class="menu-footer">

        <!-- Esquerda: Clock + Data -->
        <div class="footer-left">
          <div class="clock-row">
            <span id="menuClock">00:00:00</span>
            <span class="menu-tz">GMT</span>
          </div>
          <span id="menuDate">—</span>
        </div>

        <!-- Centro: Seletor de Língua -->
        <div class="footer-lang">
          <button class="lang-btn active" id="langPT">PT</button>
          <span class="lang-sep">/</span>
          <button class="lang-btn" id="langEN">EN</button>
        </div>

        <!-- Direita: Redes Sociais -->
        <div class="footer-socials">
          <a href="mailto:hello@gmarques.co" class="social-link">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <span>Email</span>
          </a>
          <a href="https://linkedin.com" target="_blank" class="social-link">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
              <rect x="2" y="9" width="4" height="12"></rect>
              <circle cx="4" cy="4" r="2"></circle>
            </svg>
            <span>LinkedIn</span>
          </a>
          <a href="https://github.com" target="_blank" class="social-link">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path
                d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22">
              </path>
            </svg>
            <span>GitHub</span>
          </a>
        </div>

      </footer>
    </div>
  </div>

  <section class="hero-stage" id="hero">

    <!-- ── Static Background Image ──────────────────────────── -->
    <div class="hero-stage__bg">
      <img src="assets/img/hero/Fundo.jpg" alt="Hero Background">
    </div>

    <!-- ── Vogue Editorial Frame ───────────────────────────── -->
    <div class="hero-stage__content">
      <h1 class="hero-stage__title">
        <span class="h-line"><span class="h-line-inner">Guilherme</span></span>
        <span class="h-line"><span class="h-line-inner">Marques</span></span>
      </h1>
      <div class="hero-stage__staggered-subtitle">
        <div class="stagger-line line-2" style="overflow: hidden; padding: 0.1em 0;">
          <span id="scrambling-text">Web Developer</span>
        </div>
      </div>
    </div>

  </section>

  <!-- DUMMY SECTION / SELECTED WORK -->
  <section id="work"
    style="height: 100vh; background-color: var(--color-sand); padding: 120px 80px; display: flex; flex-direction: column; justify-content: center;">
    <div style="max-width: 1200px; margin: 0 auto; width: 100%;">
      <p
        style="font-family: var(--font-body); text-transform: uppercase; letter-spacing: 5px; font-size: 0.8rem; margin-bottom: 40px; opacity: 0.5;">
        01. Selected Projects</p>
      <h2
        style="font-family: var(--font-heading); font-size: clamp(3rem, 6vw, 5rem); color: var(--color-espresso); line-height: 1.1;">
        Curating Digital <br>Excellence.
      </h2>
    </div>
  </section>

  <script src="assets/js/menu.js"></script>
  <script src="assets/js/random-letter-swap.js"></script>
  <script src="assets/js/audio.js"></script>
  <script src="assets/js/preloader.js"></script>
  <script>
    // Minimalist Reveal (if needed, currently using CSS animations)
  </script>
</body>

</html>
